name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Static linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run prettier:ci

      - run: npm run eslint:ci

      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Install auth proxy dependencies
        run: npm --prefix auth-proxy ci

      - name: Type-check auth proxy
        run: npm --prefix auth-proxy run typecheck

      - name: Build auth proxy
        run: npm --prefix auth-proxy run build

      - name: Test auth proxy security
        run: npm --prefix auth-proxy test

      - name: Check compiled auth proxy health
        run: |
          set -euo pipefail
          node auth-proxy/dist/proxy.mjs --port 44123 > "$RUNNER_TEMP/explorer-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:44123/health | jq -e '.status == "ok"'

  containers:
    name: Container smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start local containers
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Check SPA and auth proxy through nginx
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/ > "$RUNNER_TEMP/explorer-index.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/explorer-index.html"
          curl --fail --silent --show-error \
            http://127.0.0.1:8080/proxy-api/health | jq -e '.status == "ok"'

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  build-preview-validate:
    name: Validate asset paths under VITE_BASE prefixes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Build with /explorer/ base and verify asset paths
        run: |
          set -euo pipefail
          npm run build
          grep -E 'src="|href="' dist/app/index.html | grep -v 'src=""' | while read -r line; do
            if ! echo "$line" | grep -qE 'src="/explorer/|href="/explorer/'; then
              echo "ERROR: asset path does not start with /explorer/ — $line" >&2
              exit 1
            fi
          done
        env:
          VITE_BASE: /explorer/

      - name: Build with /pr-preview/explorer/pr-99/ base and verify asset paths
        run: |
          set -euo pipefail
          npm run build
          grep -E 'src="|href="' dist/app/index.html | grep -v 'src=""' | while read -r line; do
            if ! echo "$line" | grep -qE 'src="/pr-preview/explorer/pr-99/|href="/pr-preview/explorer/pr-99/'; then
              echo "ERROR: asset path does not start with /pr-preview/explorer/pr-99/ — $line" >&2
              exit 1
            fi
          done
        env:
          VITE_BASE: /pr-preview/explorer/pr-99/

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run test:e2e
        env:
          CI: "true"
