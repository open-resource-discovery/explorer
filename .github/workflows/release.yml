name: Release

on:
  workflow_dispatch:
    inputs:
      npm:
        description: "NPM Package"
        required: false
        type: boolean
        default: true
      docker:
        description: "Docker Image"
        required: false
        type: boolean
        default: true
      githubRelease:
        description: "GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  npm:
    if: |-
      github.ref == 'refs/heads/main' && (
      inputs.npm
      )
    runs-on: ubuntu-latest
    environment: npmjs-registry
    # CI dispatch mirrors check runs and commit statuses onto the changelog PR.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"
          registry-url: ${{ vars.NPM_REGISTRY }}

      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.20.0 --registry=https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: |
          npm run build
          npm run build:lib

      - name: Verify package contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module - "$RUNNER_TEMP/npm-pack.json" <<'NODE'
          import { readFileSync } from "node:fs";

          const { exports } = JSON.parse(readFileSync("package.json", "utf8"));
          const [packed] = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const paths = new Set(packed.files.map(({ path }) => `./${path}`));
          const targets = (entry) =>
            typeof entry === "string" ? [entry] : Object.values(entry ?? {}).flatMap(targets);
          const missing = [...new Set(targets(exports))].filter((path) => !paths.has(path));
          if (missing.length) {
            throw new Error(`Missing package exports: ${missing.join(", ")}`);
          }
          NODE

      - name: Publish to NPM
        run: npm publish --access public --provenance

  docker:
    if: |-
      github.ref == 'refs/heads/main' && (
      inputs.docker
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set Docker Tags
        id: docker_tags
        run: |
          VERSION=$(node -p -e "require('./package.json').version")

          TAGS="ghcr.io/open-resource-discovery/explorer:$VERSION"
          if [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            TAGS="$TAGS,ghcr.io/open-resource-discovery/explorer:latest"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.docker_tags.outputs.tags }}
          push: true
          platforms: linux/amd64,linux/arm64

  githubRelease:
    needs: [npm, docker]
    if: |-
      github.ref == 'refs/heads/main' && (
      always() &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'failure') &&
      inputs.githubRelease
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # Needed by the release/push step
      - name: Create GitHub Release
        uses: open-resource-discovery/github-release@2d8817b7382966b490d5c78125d97da14ee918bc # verified on github-release main
        with:
          ci-workflows: main.yml
